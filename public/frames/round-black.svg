<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180">
<defs>
  <filter id="sh" x="-10%" y="-15%" width="120%" height="145%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/>
  </filter>
  <linearGradient id="fg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#3a3a3a"/>
    <stop offset="40%" stop-color="#1c1c1c"/>
    <stop offset="100%" stop-color="#0a0a0a"/>
  </linearGradient>
  <radialGradient id="lg" cx="35%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#c0d8f0" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#c0d8f0" stop-opacity="0.04"/>
  </radialGradient>
  <linearGradient id="sg" x1="10%" y1="0%" x2="80%" y2="100%">
    <stop offset="0%" stop-color="#fff" stop-opacity="0.22"/>
    <stop offset="45%" stop-color="#fff" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs>
<g filter="url(#sh)">
  <!-- Left lens circle -->
  <circle cx="152" cy="90" r="82" fill="url(#lg)"/>
  <circle cx="152" cy="90" r="82" fill="none" stroke="url(#fg)" stroke-width="10"/>
  <!-- Right lens circle -->
  <circle cx="448" cy="90" r="82" fill="url(#lg)"/>
  <circle cx="448" cy="90" r="82" fill="none" stroke="url(#fg)" stroke-width="10"/>
  <!-- Bridge -->
  <path d="M234 72 Q300 52 366 72" fill="none" stroke="url(#fg)" stroke-width="8" stroke-linecap="round"/>
  <!-- Left temple -->
  <path d="M70 90 Q8 92 0 102" fill="none" stroke="url(#fg)" stroke-width="8" stroke-linecap="round"/>
  <!-- Right temple -->
  <path d="M530 90 Q592 92 600 102" fill="none" stroke="url(#fg)" stroke-width="8" stroke-linecap="round"/>
  <!-- Shine -->
  <ellipse cx="152" cy="62" rx="62" ry="18" fill="url(#sg)"/>
  <ellipse cx="448" cy="62" rx="62" ry="18" fill="url(#sg)"/>
</g>
</svg>
