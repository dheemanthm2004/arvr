<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180">
<defs>
  <filter id="sh" x="-10%" y="-15%" width="120%" height="145%">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
  </filter>
  <linearGradient id="fg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#e8e8e8"/>
    <stop offset="45%" stop-color="#b8b8b8"/>
    <stop offset="100%" stop-color="#888"/>
  </linearGradient>
  <radialGradient id="lg" cx="35%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#d0e0f0" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#d0e0f0" stop-opacity="0.02"/>
  </radialGradient>
</defs>
<g filter="url(#sh)">
  <!-- Subtle lens fill -->
  <ellipse cx="152" cy="90" rx="100" ry="58" fill="url(#lg)"/>
  <ellipse cx="448" cy="90" rx="100" ry="58" fill="url(#lg)"/>
  <!-- Top arc only (rimless) -->
  <path d="M52 86 A100 58 0 0 1 252 86" fill="none" stroke="url(#fg)" stroke-width="2.2"/>
  <path d="M348 86 A100 58 0 0 1 548 86" fill="none" stroke="url(#fg)" stroke-width="2.2"/>
  <!-- Bridge -->
  <path d="M252 74 Q300 60 348 74" fill="none" stroke="url(#fg)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nose pads -->
  <circle cx="246" cy="82" r="3" fill="url(#fg)"/>
  <circle cx="354" cy="82" r="3" fill="url(#fg)"/>
  <!-- Temples -->
  <path d="M52 90 Q8 92 0 102" fill="none" stroke="url(#fg)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M548 90 Q592 92 600 102" fill="none" stroke="url(#fg)" stroke-width="2.2" stroke-linecap="round"/>
</g>
</svg>
