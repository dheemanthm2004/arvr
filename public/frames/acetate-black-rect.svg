<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180">
<defs>
  <filter id="sh" x="-10%" y="-15%" width="120%" height="145%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/>
  </filter>
  <linearGradient id="fg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#3a3a3a"/>
    <stop offset="40%" stop-color="#1c1c1c"/>
    <stop offset="100%" stop-color="#0a0a0a"/>
  </linearGradient>
  <radialGradient id="lg" cx="35%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#b8d4f0" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#b8d4f0" stop-opacity="0.04"/>
  </radialGradient>
  <linearGradient id="sg" x1="10%" y1="0%" x2="80%" y2="100%">
    <stop offset="0%" stop-color="#fff" stop-opacity="0.22"/>
    <stop offset="45%" stop-color="#fff" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs>
<g filter="url(#sh)">
  <!-- Left lens -->
  <rect x="18" y="28" width="228" height="124" rx="8" fill="url(#lg)"/>
  <rect x="18" y="28" width="228" height="124" rx="8" fill="none" stroke="url(#fg)" stroke-width="11"/>
  <!-- Right lens -->
  <rect x="354" y="28" width="228" height="124" rx="8" fill="url(#lg)"/>
  <rect x="354" y="28" width="228" height="124" rx="8" fill="none" stroke="url(#fg)" stroke-width="11"/>
  <!-- Bridge -->
  <path d="M246 78 Q300 58 354 78" fill="none" stroke="url(#fg)" stroke-width="8" stroke-linecap="round"/>
  <!-- Left temple -->
  <path d="M18 90 Q6 92 0 100" fill="none" stroke="url(#fg)" stroke-width="8" stroke-linecap="round"/>
  <!-- Right temple -->
  <path d="M582 90 Q594 92 600 100" fill="none" stroke="url(#fg)" stroke-width="8" stroke-linecap="round"/>
  <!-- Lens shine -->
  <rect x="26" y="34" width="212" height="34" rx="4" fill="url(#sg)"/>
  <rect x="362" y="34" width="212" height="34" rx="4" fill="url(#sg)"/>
</g>
</svg>
